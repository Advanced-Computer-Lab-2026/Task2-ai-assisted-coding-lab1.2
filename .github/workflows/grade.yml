name: Grade
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  functional-grade:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm test

  submission-format:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check PR description identifier
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          pattern='^[A-Za-z0-9]{2}-[A-Za-z0-9]{5}[[:space:]]+T[A-Za-z0-9]{2}$'
          matches=0
          placeholder=0
          while IFS= read -r line; do
            line="${line%$'\r'}"
            trimmed="$(printf '%s' "$line" | sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//')"
            if [[ "$trimmed" =~ $pattern ]]; then
              if [[ "$trimmed" == "XX-XXXXX TXX" ]]; then
                placeholder=1
              else
                matches=$((matches + 1))
              fi
            fi
          done <<< "${PR_BODY}"
          if [[ "$matches" -eq 1 ]]; then
            echo "Submission format: PASS"
          else
            if [[ "$placeholder" -eq 1 && "$matches" -eq 0 ]]; then
              echo "The placeholder XX-XXXXX TXX was not replaced."
            fi
            echo "Expected exactly one line matching: XX-XXXXX TXX"
            echo "Submission format: FAIL"
            exit 1
          fi
