name: Grade
on:
  pull_request_target:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  functional-grade:
    runs-on: ubuntu-latest
    env:
      MONGO_URI: "mongodb://tasks:pass1234@ac-j3acrgb-shard-00-00.lueesfz.mongodb.net:27017,ac-j3acrgb-shard-00-01.lueesfz.mongodb.net:27017,ac-j3acrgb-shard-00-02.lueesfz.mongodb.net:27017/?ssl=true&replicaSet=atlas-6to6iy-shard-0&authSource=admin&appName=Cluster0"
    defaults:
      run:
        working-directory: server
    steps:
      # Student source code from the PR head (or main on manual runs).
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      # Grading files always come from this repository's main branch, so edits
      # to tests or dependencies in a PR do not affect the grade.
      - name: Use grading files from main
        working-directory: .
        run: |
          git fetch --no-tags --depth=1 "https://github.com/${{ github.repository }}.git" main
          git checkout FETCH_HEAD -- server/tests server/package.json server/package-lock.json
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm test

  submission-format:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      - name: Check PR description identifier
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          pattern='^[A-Za-z0-9]{2}-[A-Za-z0-9]{5}[[:space:]]+T[A-Za-z0-9]{2}$'
          matches=0
          placeholder=0
          while IFS= read -r line; do
            line="${line%$'\r'}"
            trimmed="$(printf '%s' "$line" | sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//')"
            if [[ "$trimmed" =~ $pattern ]]; then
              if [[ "$trimmed" == "XX-XXXXX TXX" ]]; then
                placeholder=1
              else
                matches=$((matches + 1))
              fi
            fi
          done <<< "${PR_BODY}"
          if [[ "$matches" -eq 1 ]]; then
            echo "Submission format: PASS"
          else
            if [[ "$placeholder" -eq 1 && "$matches" -eq 0 ]]; then
              echo "The placeholder XX-XXXXX TXX was not replaced."
            fi
            echo "Expected exactly one line matching: XX-XXXXX TXX"
            echo "Submission format: FAIL"
            exit 1
          fi
